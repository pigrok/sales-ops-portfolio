<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>환급 지표 계산기</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #fff;
      --line: #d1d5db;
      --text: #111827;
      --sub: #6b7280;
      --accent: #2563eb;
      --accent-2: #1d4ed8;
      --ok: #047857;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    .wrap { max-width: 1400px; margin: 0 auto; display: grid; gap: 14px; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap;
    }
    .topbar h1 { margin: 0; font-size: 20px; }
    .topbar .muted { margin: 4px 0 0; }
    .topbar-actions { display: flex; gap: 8px; align-items: center; }
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      align-items: start;
    }
    .col { display: grid; gap: 14px; align-content: start; }
    @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
    .muted { margin: 0; color: var(--sub); font-size: 13px; }
    .section-title { margin: 0 0 12px; font-size: 15px; font-weight: 700; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
    label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--sub); }
    input[type="text"], input[type="month"], textarea {
      width: 100%; border: 1px solid var(--line); border-radius: 8px;
      padding: 10px 12px; font-size: 15px; background: #fff; color: var(--text);
    }
    input[readonly] { background: #f3f4f6; color: #374151; }
    button {
      border: 0; border-radius: 8px; padding: 10px 16px;
      font-size: 14px; font-weight: 600; cursor: pointer; background: var(--accent); color: #fff;
    }
    button:hover { background: var(--accent-2); }
    button.secondary { background: #e5e7eb; color: #111827; }
    .status { margin-top: 8px; color: var(--sub); font-size: 13px; }
    .dropzone {
      border: 2px dashed #c7ccd6; border-radius: 12px; background: #fbfcfe;
      padding: 14px 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 12px;
    }
    .dropzone:hover, .dropzone.dragover { border-color: var(--accent); background: #eef4ff; }
    .dz-icon {
      width: 34px; height: 34px; flex: none;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; background: #eef2ff; color: var(--accent);
    }
    .dz-title { font-size: 14px; font-weight: 700; color: #374151; }
    .dz-sub { margin-top: 2px; font-size: 12px; color: var(--sub); }
    .preview {
      display: none; margin-top: 12px; width: 100%;
      object-fit: contain; border: 1px solid var(--line); border-radius: 8px; background: #fafafa;
    }
    .kpi { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: #fbfdff; }
    .kpi .name { font-size: 12px; color: var(--sub); }
    .kpi .val { margin-top: 6px; font-size: 22px; font-weight: 800; color: var(--ok); }
    .calc-grid { display: grid; grid-template-columns: 1fr 1fr 26px 1fr; gap: 12px; align-items: stretch; }
    .calc-grid .field { display: flex; flex-direction: column; justify-content: flex-end; }
    .calc-grid .arrow { display: flex; align-items: center; justify-content: center; color: var(--sub); font-size: 20px; font-weight: 700; }
    .calc-grid .kpi { display: flex; flex-direction: column; justify-content: center; }
    @media (max-width: 720px) {
      .calc-grid { grid-template-columns: 1fr 1fr; }
      .calc-grid .arrow { display: none; }
      .calc-grid .kpi { grid-column: 1 / -1; }
    }
    textarea.report {
      min-height: 340px; line-height: 1.5; resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      white-space: pre-wrap;
    }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #eef0f4; text-align: right; white-space: nowrap; }
    th { color: var(--sub); font-weight: 600; background: #fafbfe; }
    th:first-child, td:first-child { text-align: left; }
    .empty { color: var(--sub); padding: 16px; text-align: center; }
    .del-btn {
      color: #9ca3af; background: transparent; padding: 2px 8px;
      font-size: 16px; line-height: 1; font-weight: 700;
    }
    .del-btn:hover { color: #b91c1c; background: transparent; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div>
        <h1>환급 지표 계산기</h1>
        <p class="muted">이미지를 첨부하면 Google OCR로 수치를 자동 추출하고, 저장하면 데일리 현황에 누적됩니다.</p>
      </div>
      <div class="topbar-actions">
        <button id="resetBtn" type="button" class="secondary">입력 초기화</button>
      </div>
    </header>
    <div id="copyStatus" class="status" style="margin-top:-6px;"></div>

    <div class="two-col">
      <div class="col">
        <section class="card">
          <p class="section-title">이미지 첨부</p>
          <div id="dropZone" class="dropzone">
            <input id="imageFile" type="file" accept="image/*" hidden />
            <div class="dz-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
              </svg>
            </div>
            <div>
              <div class="dz-title">이미지를 드래그하거나 클릭하여 선택</div>
              <div class="dz-sub">PNG, JPG 등 대시보드 스크린샷</div>
            </div>
          </div>
          <div id="ocrStatus" class="status"></div>
          <img id="imagePreview" class="preview" alt="첨부 이미지 미리보기" />
        </section>
      </div>

      <div class="col">
        <section class="card">
          <p class="section-title">입력값 · 지표</p>
          <div class="grid">
            <div>
              <label for="reportDate">기준일자</label>
              <input id="reportDate" type="text" readonly />
            </div>
            <div>
              <label for="remainingDays">남은 영업 일수</label>
              <input id="remainingDays" type="text" readonly />
            </div>
          </div>

          <div class="calc-grid" style="margin-top:14px;">
            <div class="field">
              <label for="successApplyViewRefund">신청전환 성공 환급액 (원)</label>
              <input id="successApplyViewRefund" type="text" inputmode="numeric" placeholder="0" />
            </div>
            <div class="field">
              <label for="totalViewAmount">전체 조회 금액 (원)</label>
              <input id="totalViewAmount" type="text" inputmode="numeric" placeholder="0" />
            </div>
            <div class="arrow">→</div>
            <div class="kpi">
              <div class="name">전환율</div>
              <div id="conversionRateResult" class="val">0.00%</div>
            </div>

            <div class="field">
              <label for="successCancelDefenseViewRefund">취소방어 성공 환급액 (원)</label>
              <input id="successCancelDefenseViewRefund" type="text" inputmode="numeric" placeholder="0" />
            </div>
            <div class="field">
              <label for="cancelRequestAmount">취소 요청 금액 (원)</label>
              <input id="cancelRequestAmount" type="text" inputmode="numeric" placeholder="0" />
            </div>
            <div class="arrow">→</div>
            <div class="kpi">
              <div class="name">방어율</div>
              <div id="defenseRateResult" class="val">0.00%</div>
            </div>

            <div class="field">
              <label for="claimRefundIncluding">신고환급액 (원)</label>
              <input id="claimRefundIncluding" type="text" inputmode="numeric" placeholder="0" />
            </div>
            <div class="field">
              <label for="convertedViewRefund">거래 전환된 총 조회환급액 (하반기) (원)</label>
              <input id="convertedViewRefund" type="text" inputmode="numeric" placeholder="0" />
            </div>
            <div class="arrow">→</div>
            <div class="kpi">
              <div class="name">현재 신고율</div>
              <div id="claimRateResult" class="val">0.00%</div>
            </div>

            <div class="field">
              <label for="successApplyDisplay">신청전환 성공 환급액 (원)</label>
              <input id="successApplyDisplay" type="text" readonly />
            </div>
            <div class="field">
              <label for="successCancelDisplay">취소방어 성공 환급액 (원)</label>
              <input id="successCancelDisplay" type="text" readonly />
            </div>
            <div class="arrow">→</div>
            <div class="kpi">
              <div class="name">총 성공 조회 환급액</div>
              <div id="totalConvertedResult" class="val">₩0</div>
            </div>
          </div>
          <input id="claimRefundAssigned" type="hidden" />
        </section>

        <section class="card">
          <div class="row-between" style="margin-bottom:8px;">
            <label for="reportOutput" style="margin:0;">슬랙 스레드 보고문</label>
            <button id="copyBtn" type="button" class="secondary">복사</button>
          </div>
          <textarea id="reportOutput" class="report" readonly></textarea>
        </section>
      </div>
    </div>

    <section class="card">
      <div class="row-between">
        <p class="section-title" style="margin:0;">데일리 현황</p>
        <div style="display:flex; align-items:center; gap:8px;">
          <label for="monthPicker" style="margin:0;">조회 월</label>
          <input id="monthPicker" type="month" style="width:auto;" />
          <button id="reloadBtn" type="button" class="secondary">새로고침</button>
          <button id="saveBtn" type="button">데일리 저장</button>
        </div>
      </div>
      <div id="dailyStatus" class="status"></div>
      <div class="table-scroll" style="margin-top:8px;">
        <table>
          <thead>
            <tr>
              <th>기준일자</th>
              <th>전환율</th>
              <th>방어율</th>
              <th>신고율</th>
              <th>총성공 조회 환급액</th>
              <th>저장시각</th>
              <th>담당자</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="dailyBody">
            <tr><td colspan="8" class="empty">데이터가 없습니다.</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    const HOLIDAYS = new Set([
      "2026-01-01",
      "2026-02-16", "2026-02-17", "2026-02-18",
      "2026-03-01", "2026-03-02",
      "2026-05-05", "2026-05-24", "2026-05-25",
      "2026-06-03", "2026-06-06",
      "2026-07-17",
      "2026-08-15", "2026-08-17",
      "2026-09-24", "2026-09-25", "2026-09-26",
      "2026-10-03", "2026-10-05", "2026-10-09",
      "2026-12-25"
    ]);

    const els = {
      dropZone: document.getElementById("dropZone"),
      imageFile: document.getElementById("imageFile"),
      imagePreview: document.getElementById("imagePreview"),
      reportDate: document.getElementById("reportDate"),
      remainingDays: document.getElementById("remainingDays"),
      ocrStatus: document.getElementById("ocrStatus"),
      successApplyViewRefund: document.getElementById("successApplyViewRefund"),
      totalViewAmount: document.getElementById("totalViewAmount"),
      successCancelDefenseViewRefund: document.getElementById("successCancelDefenseViewRefund"),
      cancelRequestAmount: document.getElementById("cancelRequestAmount"),
      claimRefundIncluding: document.getElementById("claimRefundIncluding"),
      convertedViewRefund: document.getElementById("convertedViewRefund"),
      claimRefundAssigned: document.getElementById("claimRefundAssigned"),
      successApplyDisplay: document.getElementById("successApplyDisplay"),
      successCancelDisplay: document.getElementById("successCancelDisplay"),
      conversionRateResult: document.getElementById("conversionRateResult"),
      defenseRateResult: document.getElementById("defenseRateResult"),
      claimRateResult: document.getElementById("claimRateResult"),
      totalConvertedResult: document.getElementById("totalConvertedResult"),
      reportOutput: document.getElementById("reportOutput"),
      saveBtn: document.getElementById("saveBtn"),
      copyBtn: document.getElementById("copyBtn"),
      resetBtn: document.getElementById("resetBtn"),
      copyStatus: document.getElementById("copyStatus"),
      monthPicker: document.getElementById("monthPicker"),
      reloadBtn: document.getElementById("reloadBtn"),
      dailyStatus: document.getElementById("dailyStatus"),
      dailyBody: document.getElementById("dailyBody")
    };

    const numberInputs = [
      els.successApplyViewRefund,
      els.totalViewAmount,
      els.successCancelDefenseViewRefund,
      els.cancelRequestAmount,
      els.claimRefundIncluding,
      els.convertedViewRefund
    ];

    let previewObjectUrl = "";
    let currentReportHtml = "";

    function pad2(n) { return String(n).padStart(2, "0"); }
    function toISO(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
    function setTodayDate() { els.reportDate.value = toISO(new Date()); }

    function remainingBusinessDays(baseISO) {
      const base = new Date(baseISO + "T00:00:00");
      if (isNaN(base.getTime())) return 0;
      const year = base.getFullYear();
      const month = base.getMonth();
      const lastDay = new Date(year, month + 1, 0).getDate();
      let count = 0;
      for (let day = base.getDate() + 1; day <= lastDay; day++) {
        const cur = new Date(year, month, day);
        const dow = cur.getDay();
        if (dow === 0 || dow === 6) continue;
        if (HOLIDAYS.has(toISO(cur))) continue;
        count += 1;
      }
      return count;
    }

    function digitsOf(str) { return String(str == null ? "" : str).replace(/[^0-9]/g, ""); }
    function withCommas(digits) { return digits ? Number(digits).toLocaleString("ko-KR") : ""; }
    function toNumber(input) { const d = digitsOf(input.value); return d ? Number(d) : 0; }
    function setInputValue(input, v) { input.value = withCommas(digitsOf(String(v))); }
    function formatWon(value) { return `₩${Math.round(value).toLocaleString("ko-KR")}`; }
    function formatPercent(value) { return `${(value * 100).toFixed(2)}%`; }
    function safeDivide(a, b) { return b ? a / b : 0; }
    function escapeHtml(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function getMetrics() {
      const successApplyViewRefund = toNumber(els.successApplyViewRefund);
      const totalViewAmount = toNumber(els.totalViewAmount);
      const successCancelDefenseViewRefund = toNumber(els.successCancelDefenseViewRefund);
      const cancelRequestAmount = toNumber(els.cancelRequestAmount);
      const claimRefundIncluding = toNumber(els.claimRefundIncluding);
      const convertedViewRefund = toNumber(els.convertedViewRefund);
      const claimRefundAssigned = toNumber(els.claimRefundAssigned);
      return {
        reportDate: els.reportDate.value,
        remainingDays: remainingBusinessDays(els.reportDate.value),
        successApplyViewRefund,
        totalViewAmount,
        successCancelDefenseViewRefund,
        cancelRequestAmount,
        claimRefundIncluding,
        convertedViewRefund,
        claimRefundAssigned,
        conversionRate: safeDivide(successApplyViewRefund, totalViewAmount),
        defenseRate: safeDivide(successCancelDefenseViewRefund, cancelRequestAmount),
        claimRate: safeDivide(claimRefundIncluding, convertedViewRefund),
        totalConverted: successApplyViewRefund + successCancelDefenseViewRefund
      };
    }

    function buildReport(m) {
      const lines = [
        { text: "🏆 성과 요약", bold: true },
        { text: `● 기준일자 : ${m.reportDate}` },
        { text: `● 남은 영업 일수 : ${m.remainingDays}일` },
        { text: "------------------------------" },
        { text: `📌 전환율 : ${formatPercent(m.conversionRate)}`, bold: true },
        { text: `◦ 신청전환 성공 환급액 : ${formatWon(m.successApplyViewRefund)}` },
        { text: `◦ 전체 조회 금액 : ${formatWon(m.totalViewAmount)}` },
        { text: "" },
        { text: `📌 방어율 : ${formatPercent(m.defenseRate)}`, bold: true },
        { text: `◦ 취소방어 성공 환급액 : ${formatWon(m.successCancelDefenseViewRefund)}` },
        { text: `◦ 취소 요청 금액 : ${formatWon(m.cancelRequestAmount)}` },
        { text: "" },
        { text: `📌 현재 신고율 : ${formatPercent(m.claimRate)}`, bold: true },
        { text: `◦ 신고환급액 : ${formatWon(m.claimRefundIncluding)}` },
        { text: `◦ 거래 전환된 총 조회환급액 (하반기) : ${formatWon(m.convertedViewRefund)}` },
        { text: "" },
        { text: `📌 총 성공 조회 환급액 : ${formatWon(m.totalConverted)}`, bold: true },
        { text: `● 신청전환 성공 조회환급액 ${formatWon(m.successApplyViewRefund)}` },
        { text: `● 취소방어 성공 조회환급액 ${formatWon(m.successCancelDefenseViewRefund)}` }
      ];
      const plain = lines.map((l) => l.text).join("\n");
      const html =
        '<div style="font-family:-apple-system,Segoe UI,Roboto,sans-serif;">' +
        lines.map((l) => {
          const safe = escapeHtml(l.text) || "&nbsp;";
          return l.bold ? `<div><b>${safe}</b></div>` : `<div>${safe}</div>`;
        }).join("") +
        "</div>";
      return { plain, html };
    }

    function recalc() {
      const m = getMetrics();
      els.remainingDays.value = `${m.remainingDays}일`;
      els.conversionRateResult.textContent = formatPercent(m.conversionRate);
      els.defenseRateResult.textContent = formatPercent(m.defenseRate);
      els.claimRateResult.textContent = formatPercent(m.claimRate);
      els.successApplyDisplay.value = withCommas(digitsOf(String(m.successApplyViewRefund))) || "0";
      els.successCancelDisplay.value = withCommas(digitsOf(String(m.successCancelDefenseViewRefund))) || "0";
      els.totalConvertedResult.textContent = formatWon(m.totalConverted);
      const report = buildReport(m);
      els.reportOutput.value = report.plain;
      currentReportHtml = report.html;
    }

    function clearImagePreview() {
      els.imageFile.value = "";
      if (previewObjectUrl) { URL.revokeObjectURL(previewObjectUrl); previewObjectUrl = ""; }
      els.imagePreview.style.display = "none";
      els.imagePreview.removeAttribute("src");
    }

    function resetAll() {
      numberInputs.forEach((input) => { input.value = ""; });
      els.claimRefundAssigned.value = "";
      clearImagePreview();
      setTodayDate();
      els.ocrStatus.textContent = "";
      els.copyStatus.textContent = "";
      recalc();
    }

    function readFileAsBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const result = String(reader.result || "");
          const comma = result.indexOf(",");
          resolve(comma >= 0 ? result.slice(comma + 1) : result);
        };
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }

    /**
     * 파란 대시보드 배경에서 흰 카드 경계를 자동 감지한 뒤 필요한 KPI 카드만 자른다.
     * 고정 픽셀/비율 좌표를 쓰지 않으므로 정사각형·와이드 다운로드 모두 대응한다.
     */
    function cropDashboardCards(file) {
      return loadImageFromFile_(file).then((image) => {
        const regions = detectDashboardCardRegions_(image);

        return regions.map((r) => {
          const sx = r.x;
          const sy = r.y;
          const sw = r.w;
          const sh = r.h;
          const scale = 2;
          const canvas = document.createElement("canvas");
          canvas.width = sw * scale;
          canvas.height = sh * scale;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(image, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
          const dataUrl = canvas.toDataURL("image/jpeg", 0.92);
          return {
            key: r.key,
            base64: dataUrl.slice(dataUrl.indexOf(",") + 1),
            mimeType: "image/jpeg"
          };
        });
      });
    }

    /**
     * 흰색 카드들의 연결 영역을 찾고 행 단위로 묶는다.
     *
     * 현재 대시보드 구조:
     *   1행 첫 카드 = 전체 조회, 마지막 카드 = 거래 전환된 총 조회
     *   2행 첫 카드 = 신청전환 성공, 마지막 카드 = 신고완료
     *   3행 첫 카드 = 취소 요청
     *   4행 첫 카드 = 취소방어 성공
     */
    function detectDashboardCardRegions_(image) {
      const sampleWidth = Math.min(360, image.width);
      const sampleHeight = Math.max(1, Math.round(image.height * sampleWidth / image.width));
      const canvas = document.createElement("canvas");
      canvas.width = sampleWidth;
      canvas.height = sampleHeight;
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(image, 0, 0, sampleWidth, sampleHeight);
      const pixels = ctx.getImageData(0, 0, sampleWidth, sampleHeight).data;
      const size = sampleWidth * sampleHeight;
      const white = new Uint8Array(size);
      const seen = new Uint8Array(size);

      for (let i = 0; i < size; i++) {
        const p = i * 4;
        const r = pixels[p];
        const g = pixels[p + 1];
        const b = pixels[p + 2];
        // 카드 내부는 거의 흰색, 카드 사이 배경은 파란색이다.
        if (r >= 238 && g >= 238 && b >= 238) white[i] = 1;
      }

      const components = [];
      const queue = new Int32Array(size);
      const minArea = Math.max(40, Math.round(size * 0.002));

      for (let start = 0; start < size; start++) {
        if (!white[start] || seen[start]) continue;
        let head = 0;
        let tail = 0;
        queue[tail++] = start;
        seen[start] = 1;
        let count = 0;
        let minX = sampleWidth;
        let maxX = 0;
        let minY = sampleHeight;
        let maxY = 0;

        while (head < tail) {
          const idx = queue[head++];
          const x = idx % sampleWidth;
          const y = Math.floor(idx / sampleWidth);
          count += 1;
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;

          const neighbors = [];
          if (x > 0) neighbors.push(idx - 1);
          if (x + 1 < sampleWidth) neighbors.push(idx + 1);
          if (y > 0) neighbors.push(idx - sampleWidth);
          if (y + 1 < sampleHeight) neighbors.push(idx + sampleWidth);
          for (let ni = 0; ni < neighbors.length; ni++) {
            const next = neighbors[ni];
            if (!white[next] || seen[next]) continue;
            seen[next] = 1;
            queue[tail++] = next;
          }
        }

        const width = maxX - minX + 1;
        const height = maxY - minY + 1;
        if (
          count >= minArea &&
          width >= sampleWidth * 0.075 &&
          width <= sampleWidth * 0.8 &&
          height >= sampleHeight * 0.075
        ) {
          components.push({
            x: minX,
            y: minY,
            w: width,
            h: height,
            cx: minX + width / 2,
            cy: minY + height / 2
          });
        }
      }

      // 같은 높이에 있는 카드를 한 행으로 묶는다.
      components.sort((a, b) => a.cy - b.cy || a.x - b.x);
      const rows = [];
      const rowTolerance = sampleHeight * 0.065;
      components.forEach((card) => {
        let row = rows.find((r) => Math.abs(r.cy - card.cy) <= rowTolerance);
        if (!row) {
          row = { cy: card.cy, cards: [] };
          rows.push(row);
        }
        row.cards.push(card);
        row.cy = row.cards.reduce((sum, c) => sum + c.cy, 0) / row.cards.length;
      });
      rows.sort((a, b) => a.cy - b.cy);
      rows.forEach((row) => row.cards.sort((a, b) => a.x - b.x));

      if (
        rows.length < 4 ||
        rows[0].cards.length < 2 ||
        rows[1].cards.length < 2
      ) {
        throw new Error(
          `카드 영역 자동 감지 실패 (${rows.length}개 행). 대시보드 전체가 보이도록 다시 다운로드해주세요.`
        );
      }

      const selected = [
        { key: "totalViewAmount", card: rows[0].cards[0] },
        { key: "convertedViewRefund", card: rows[0].cards[rows[0].cards.length - 1] },
        { key: "successApplyViewRefund", card: rows[1].cards[0] },
        { key: "claimRefundIncluding", card: rows[1].cards[rows[1].cards.length - 1] },
        { key: "cancelRequestAmount", card: rows[2].cards[0] },
        { key: "successCancelDefenseViewRefund", card: rows[3].cards[0] }
      ];

      const scaleX = image.width / sampleWidth;
      const scaleY = image.height / sampleHeight;
      const padding = Math.max(2, Math.round(image.width * 0.003));
      return selected.map((item) => {
        const card = item.card;
        const x = Math.max(0, Math.floor(card.x * scaleX) - padding);
        const y = Math.max(0, Math.floor(card.y * scaleY) - padding);
        const right = Math.min(image.width, Math.ceil((card.x + card.w) * scaleX) + padding);
        const bottom = Math.min(image.height, Math.ceil((card.y + card.h) * scaleY) + padding);
        return {
          key: item.key,
          x: x,
          y: y,
          w: right - x,
          h: bottom - y
        };
      });
    }

    function loadImageFromFile_(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const image = new Image();
        image.onload = () => {
          URL.revokeObjectURL(url);
          resolve(image);
        };
        image.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("이미지를 열 수 없습니다."));
        };
        image.src = url;
      });
    }

    function fillFields(fields) {
      let filled = 0;
      const mapped = Object.assign({}, fields || {});
      // OCR의 신고환급액이 claimRefundAssigned로만 오면 입력칸에도 반영
      if (Number.isFinite(mapped.claimRefundAssigned) && !Number.isFinite(mapped.claimRefundIncluding)) {
        mapped.claimRefundIncluding = mapped.claimRefundAssigned;
      }
      Object.entries(mapped).forEach(([key, value]) => {
        if (!Number.isFinite(value) || !els[key]) return;
        if (key === "claimRefundAssigned") {
          setInputValue(els[key], value);
          return;
        }
        if (!digitsOf(els[key].value)) {
          setInputValue(els[key], value);
          filled += 1;
        }
      });
      // 신고환급액 입력 시 숨김 담당자 값도 동기화
      if (digitsOf(els.claimRefundIncluding.value)) {
        setInputValue(els.claimRefundAssigned, toNumber(els.claimRefundIncluding));
      }
      recalc();
      return filled;
    }

    function handleFile(file) {
      if (!file) return;
      if (previewObjectUrl) { URL.revokeObjectURL(previewObjectUrl); previewObjectUrl = ""; }
      previewObjectUrl = URL.createObjectURL(file);
      els.imagePreview.src = previewObjectUrl;
      els.imagePreview.style.display = "block";

      els.ocrStatus.textContent = "카드 6개를 분리하여 분석 중... (무료 Google OCR)";
      cropDashboardCards(file).then((cards) => {
        google.script.run
          .withSuccessHandler((res) => {
            const filled = fillFields(res && res.fields);
            els.ocrStatus.textContent = filled > 0
              ? `자동 추출 완료: ${filled}개 항목 반영 (값이 다르면 직접 수정)`
              : "자동 추출 실패: 항목을 직접 입력해주세요.";
          })
          .withFailureHandler((err) => {
            els.ocrStatus.textContent = "이미지 분석 실패: " + (err && err.message ? err.message : "직접 입력해주세요.");
          })
          .ocrExtract({ cards: cards });
      }).catch((err) => {
        els.ocrStatus.textContent = "이미지 읽기 실패: " + (err && err.message ? err.message : "직접 입력해주세요.");
      });
    }

    async function copyReport() {
      const plain = els.reportOutput.value;
      const html = currentReportHtml;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              "text/plain": new Blob([plain], { type: "text/plain" }),
              "text/html": new Blob([html], { type: "text/html" })
            })
          ]);
          els.copyStatus.textContent = "복사 완료 (슬랙에 붙여넣으면 볼드 적용)";
          return;
        }
        throw new Error("clipboard unsupported");
      } catch (e) {
        try {
          els.reportOutput.removeAttribute("readonly");
          els.reportOutput.focus();
          els.reportOutput.select();
          document.execCommand("copy");
          els.reportOutput.setAttribute("readonly", "readonly");
          els.copyStatus.textContent = "복사 완료";
        } catch (e2) {
          els.copyStatus.textContent = "복사 실패: 직접 선택 후 복사해주세요.";
        }
      }
    }

    function currentMonth() {
      const d = new Date();
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
    }

    function saveDaily() {
      els.saveBtn.disabled = true;
      els.dailyStatus.textContent = "저장 중...";

      const payload = {
        date: els.reportDate.value,
        totalViewAmount: toNumber(els.totalViewAmount),
        successApplyViewRefund: toNumber(els.successApplyViewRefund),
        successCancelDefenseViewRefund: toNumber(els.successCancelDefenseViewRefund),
        cancelRequestAmount: toNumber(els.cancelRequestAmount),
        convertedViewRefund: toNumber(els.convertedViewRefund),
        claimRefundAssigned: toNumber(els.claimRefundIncluding),
        claimRefundIncluding: toNumber(els.claimRefundIncluding)
      };

      google.script.run
        .withSuccessHandler((res) => {
          els.saveBtn.disabled = false;
          const location = res && res.sheetName
            ? ` · ${res.sheetName} ${res.row}행`
            : "";
          els.dailyStatus.textContent = res && res.updated
            ? `저장 완료 (${res.date} 기존 데이터 덮어씀${location})`
            : `저장 완료 (${res.date}${location})`;
          els.monthPicker.value = String(payload.date).slice(0, 7);
          loadDaily();
        })
        .withFailureHandler((err) => {
          els.saveBtn.disabled = false;
          const message = err && err.message ? err.message : String(err || "알 수 없는 오류");
          els.dailyStatus.textContent = "저장 실패: " + message;
        })
        .saveDaily(payload);
    }

    function renderDaily(rows) {
      if (!rows || rows.length === 0) {
        els.dailyBody.innerHTML = '<tr><td colspan="8" class="empty">데이터가 없습니다.</td></tr>';
        return;
      }
      els.dailyBody.innerHTML = rows.map((r) => {
        return "<tr>" +
          `<td>${escapeHtml(r.date)}</td>` +
          `<td>${formatPercent(r.conversionRate)}</td>` +
          `<td>${formatPercent(r.defenseRate)}</td>` +
          `<td>${formatPercent(r.claimRate)}</td>` +
          `<td>${formatWon(r.totalConverted)}</td>` +
          `<td>${escapeHtml(r.updatedAt)}</td>` +
          `<td>${escapeHtml(r.userEmail || "-")}</td>` +
          `<td><button type="button" class="del-btn" data-date="${escapeHtml(r.date)}" title="삭제">×</button></td>` +
          "</tr>";
      }).join("");
    }

    function loadDaily() {
      const ym = els.monthPicker.value || currentMonth();
      els.dailyStatus.textContent = "불러오는 중...";
      google.script.run
        .withSuccessHandler((rows) => {
          renderDaily(rows);
          els.dailyStatus.textContent = `${ym} · ${rows ? rows.length : 0}건`;
        })
        .withFailureHandler((err) => {
          els.dailyStatus.textContent = "불러오기 실패: " + (err && err.message ? err.message : "");
        })
        .listDaily(ym);
    }

    function onDailyClick(e) {
      const btn = e.target.closest(".del-btn");
      if (!btn) return;
      const date = btn.getAttribute("data-date");
      if (!date) return;
      if (!confirm(`${date} 데이터를 삭제할까요?`)) return;
      els.dailyStatus.textContent = "삭제 중...";
      google.script.run
        .withSuccessHandler(() => loadDaily())
        .withFailureHandler((err) => {
          els.dailyStatus.textContent = "삭제 실패: " + (err && err.message ? err.message : "");
        })
        .deleteDaily(date);
    }

    els.dropZone.addEventListener("click", () => els.imageFile.click());
    els.dropZone.addEventListener("dragover", (e) => { e.preventDefault(); els.dropZone.classList.add("dragover"); });
    els.dropZone.addEventListener("dragleave", () => els.dropZone.classList.remove("dragover"));
    els.dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      els.dropZone.classList.remove("dragover");
      const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (file) handleFile(file);
    });
    els.imageFile.addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (file) handleFile(file);
    });

    numberInputs.forEach((input) => {
      input.addEventListener("input", () => {
        input.value = withCommas(digitsOf(input.value));
        recalc();
      });
    });

    els.saveBtn.addEventListener("click", saveDaily);
    els.copyBtn.addEventListener("click", copyReport);
    els.resetBtn.addEventListener("click", resetAll);
    els.reloadBtn.addEventListener("click", loadDaily);
    els.monthPicker.addEventListener("change", loadDaily);
    els.dailyBody.addEventListener("click", onDailyClick);

    setTodayDate();
    els.monthPicker.value = currentMonth();
    recalc();
    loadDaily();
  </script>
</body>
</html>
