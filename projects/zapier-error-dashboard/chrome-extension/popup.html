<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: -apple-system, sans-serif; width: 240px; padding: 16px; margin: 0; }
    h3 { margin: 0 0 12px; font-size: 14px; color: #333; }
    .status { padding: 8px 12px; border-radius: 6px; font-size: 12px; margin-bottom: 12px; }
    .status.ok { background: #e6f4ea; color: #1a7340; }
    .status.error { background: #fce8e6; color: #c5221f; }
    .status.unknown { background: #f5f5f5; color: #666; }
    button {
      width: 100%; padding: 8px; border: none; border-radius: 6px;
      background: #ff4a00; color: white; font-size: 13px;
      cursor: pointer; font-weight: 500;
    }
    button:hover { background: #e04200; }
    .time { font-size: 11px; color: #999; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <h3>⚡ Zapier Cookie Sync</h3>
  <div class="status unknown" id="status">상태 확인 중...</div>
  <button id="syncBtn">지금 동기화</button>
  <div class="time" id="lastSync"></div>

  <script src="popup.js"></script>
</body>
</html>
